services:
  ai-english-tutor:
    build:
      context: .
      dockerfile: dockerfile
    environment:
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:?set in .env}
      MOBILE_ACCESS_TOKEN: ${MOBILE_ACCESS_TOKEN:?set in .env}
      MOBILE_TEST_MODE: "1"
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 12393
    ports:
      - "18081:12393"
    volumes:
      # WORKDIR is /app and run_server.py reads "conf.yaml"/"characters"
      # relative to it, not /app/conf/*, so those were never actually
      # live-mounted -- the container only ever saw whatever was baked in
      # at the last --build.
      - ./conf.yaml:/app/conf.yaml:ro
      - ./characters:/app/characters:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:12393/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
